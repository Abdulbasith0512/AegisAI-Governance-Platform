name: Static checks (no dependencies)

# Catches deployment-blocking NameError/import bugs that `py_compile`
# cannot see. Runs on plain stdlib Python — no pip install needed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check (all Python files)
        run: python -m compileall -q backend agents ml scripts
      - name: Undefined-name check (catches NameError before Render does)
        run: python scripts/check_imports.py

  # Full suite with real dependencies + Postgres. Catches what static
  # analysis cannot: wrong decorator kwargs, bad imports at module scope,
  # failing app boot. DB tests run; live-service tests skip without URIs.
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: aegisai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres_password@localhost:5432/aegisai_db
      ALLOW_DEV_BYPASS: "true"
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Import smoke (app must boot)
        run: python -c "import sys; sys.path.insert(0, '.'); sys.path.insert(0, 'backend'); import app.main; print('routes:', len(app.main.app.routes))"
      - name: Run test suite
        run: python -m pytest backend/tests/ -q
